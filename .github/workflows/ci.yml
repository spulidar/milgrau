name: CI

on:
  push:
    branches: [milgraumaxxing]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check milgrau tests

  tests:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Full test suite
        run: pytest -q

  web:
    name: Core Web Explorer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core plus testing tools
        run: python -m pip install -e ".[dev]"
      - name: Validate read-only Web Explorer
        run: pytest -q tests/test_web_explorer.py tests/test_web_views.py
      - name: Verify JS syntax and browser-side color controls
        run: |
          node --check milgrau/web/static/js/app.js
          node --check milgrau/web/static/js/views.js
          node tests/web_color_scale.cjs
