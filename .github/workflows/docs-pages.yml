name: Documentation — Lotus Docs / Hugo / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Lotus Docs documentation
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test single-source generator
        run: python -m unittest discover -s docs/_site/tests -p 'test_build.py' -v
      - name: Generate ephemeral Hugo pages from docs/
        run: python docs/_site/build.py
      - name: Set up Go for Hugo modules
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true
      - name: Build documentation website
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --source docs/_site --gc --minify --baseURL "https://spulidar.github.io/milgrau/"
      - name: Verify scientific pages exist
        shell: bash
        run: |
          test -s docs/_site/public/index.html
          test -s docs/_site/public/docs/index.html
          test -s docs/_site/public/docs/processing/level-0/libids/index.html
          test -s docs/_site/public/docs/processing/level-1/lipancora/index.html
          test -s docs/_site/public/docs/processing/level-1/atmospheric_profiles/index.html
          test -s docs/_site/public/docs/processing/level-2/lebear/index.html
      - name: Verify homepage and mathematical rendering contract
        run: python docs/_site/check_rendered_site.py
      - name: Upload preview HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: milgrau-documentation-html
          path: docs/_site/public/
          retention-days: 7
      - name: Check whether GitHub Pages is enabled
        id: pages-check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [[ "$status" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. Set Settings > Pages > Source to GitHub Actions, then run this workflow again."
          else
            echo "::error::Unable to inspect Pages configuration (HTTP $status)"
            exit 1
          fi
      - name: Upload Pages deployment artifact
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site/public/

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy published documentation
        id: deployment
        uses: actions/deploy-pages@v4
