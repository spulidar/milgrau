[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milgrau"
dynamic = ["version"]
description = "MILGRAU processing suite for SPU-Lidar atmospheric products"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Luisa Mello" },
  { name = "Fábio J. S. Lopes" },
  { name = "Alexandre C. Yoshida" },
  { name = "Alexandre Cacheffo" },
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "xarray>=2023.1.0",
  "netCDF4>=1.7.4",
  "scipy>=1.10.0",
  "numba>=0.58.0",
  "matplotlib>=3.7.0",
  "siphon>=0.11.0",
  "cdsapi>=0.7.7",
  "tenacity>=8.2.0",
  "PyYAML>=6.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "plotly>=5.20,<7.0",
]

[project.optional-dependencies]
# The Explorer is already part of core; retain an explicit install selector.
explorer = []
# Additional dependencies for the independent measurements publisher.
web = [
  "boto3>=1.34",
]
# Optional native SCC HTTP client (no scc_access dependency).
scc = [
  "requests>=2.32,<3",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.8.0",
  "httpx>=0.27.0",
]
[project.scripts]
milgrau-libids = "milgrau.cli.libids:main"
milgrau-lipancora = "milgrau.cli.lipancora:main"
milgrau-lebear = "milgrau.cli.lebear:main"
milgrau-explorer = "milgrau.cli.explorer:main"
milgrau-inspect = "milgrau.cli.inspect:main"
milgrau-scc = "milgrau.cli.scc:main"

[tool.setuptools.dynamic]
version = {attr = "milgrau.version.__version__"}

[tool.setuptools.packages.find]
include = ["milgrau*"]

[tool.setuptools.package-data]
"milgrau.explorer" = ["static/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["milgrau"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]
