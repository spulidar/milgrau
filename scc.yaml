# SCC-specific integration catalog. Only loaded if config.yaml scc.enabled is true.
# Scientific instrument parameters and observational lidar-ratio climatology
# remain in station.yaml. Channel IDs are not product IDs.
station_id: "spu"

# Public SCC endpoint, never credential values. Authentication comes from env.
server:
  base_url: "https://scc.imaa.cnr.it/"

scc_policy:
  # SCC-enabled LIBIDS packets await LIPANCORA, which can attach only
  # validated observed radiosonde cache. No ERA5/USSA76 is substituted.
  # Set enabled: false to use immediate raw+LR uploads without LIPANCORA.
  sounding:
    enabled: true
    source: cached_wyoming
    missing_policy: skip
  lr_input:
    # External LR is applied only to eligible elastic_backscatter products.
    # The source values remain exclusively in station.yaml.
    # SCC Raman / lidar-ratio-and-extinction products are never overwritten.
    source: climatology_ancillary
    fixed_value: 1
    raman_companions_nm:
      "355": [387, 408]
      "532": [530, 607]
      "1064": []

# SCC optical product catalog transcribed from SCC Products screenshots
# (systems 248, 294, 484, 565, 1046, 1047; 30 unique products).
# "usecase" and "channel_count" are SCC-listed metadata, not scientific defaults.
# Product IDs are database identifiers, NOT SCC configuration/channel IDs.
# parent_product_id records the SCC parent relationship, which may reference
# a product that is not explicitly listed under the same system.
