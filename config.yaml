# ==========================================
# MILGRAU Configuration File
# ==========================================

project:
  name: "MILGRAU"
  full_name: "Multi-Indexed LALINET GeneRAlized and Unified algorithm"
  station_name: "SPU-Lidar"
  institution: "IPEN/USP"
  timezone: "America/Sao_Paulo"

processing:
  incremental: false
  console_level: "INFO"
  file_level: "INFO"
  laser_shot_tolerance_fraction: 0.002
  dark_current_max_association_hours: 12.0
  spurious_extensions: [".dpp", ".zip", ".txt"]
  quarantine_dir: "01-data/_quarantine"
  raw_scan_ignore_dirs: ["openmeteo_cache", "wyoming_cache"]

directories:
  raw_data: "01-data"
  processed_data: "02-processed_data"
  log_dir: "logs"

site:
  latitude: -23.5615
  longitude: -46.7383
  station_altitude_m: 760.0
  timezone: "America/Sao_Paulo"

physics:
  vertical_resolution_m: 7.5
  speed_of_light_m_s: 299792458.0
  default_surface_temp_c: 25.0
  default_surface_pressure_hpa: 940.0
  background_start_m: 29000.0
  background_stop_m: 29999.0
  pbl_min_search_m: 500.0
  pbl_max_search_m: 4000.0
  pbl_smooth_bins: 15

  channels:
    "355.PC": {deadtime_us: 0.0020, bin_shift_bins: -2, background_offset: 0.0005}
    "355.AN": {deadtime_us: 0.0000, bin_shift_bins: -11, background_offset: 0.0000}
    "387.PC": {deadtime_us: 0.0000, bin_shift_bins: -2, background_offset: 0.0000}
    "387.AN": {deadtime_us: 0.0000, bin_shift_bins: 8, background_offset: 0.0000}
    "408.PC": {deadtime_us: 0.0000, bin_shift_bins: -2, background_offset: 0.0000}
    "408.AN": {deadtime_us: 0.0000, bin_shift_bins: 8, background_offset: 0.0000}
    "530.PC": {deadtime_us: 0.0000, bin_shift_bins: -2, background_offset: 0.0000}
    "530.AN": {deadtime_us: 0.0000, bin_shift_bins: 7, background_offset: 0.0000}
    "532.PC": {deadtime_us: 0.0035, bin_shift_bins: -3, background_offset: 0.0000}
    "532.AN": {deadtime_us: 0.0000, bin_shift_bins: -12, background_offset: 0.0000}
    "1064.PC": {deadtime_us: 0.0000, bin_shift_bins: 0, background_offset: 0.0000}
    "1064.AN": {deadtime_us: 0.0000, bin_shift_bins: 1, background_offset: 0.0000}

hardware:
  name_to_id:
    "1064.AN": 934
    "1064.PC": 935
    "532.AN": 722
    "532.PC": 716
    "530.AN": 1558
    "530.PC": 1557
    "355.AN": 737
    "355.PC": 736
    "387.AN": 749
    "387.PC": 748
    "408.AN": 1446
    "408.PC": 1447

radiosonde:
  station_id: "83779"
  cache_dir: "01-data/wyoming_cache"

surface_weather:
  cache_dir: "01-data/openmeteo_cache"

visualization:
  output_format: "webp"
  dpi: 120
  altitude_ranges_km: [5, 15, 30]
  channels_to_plot:
    - "1064.AN"
    - "532.AN"
    - "532.PC"
    - "355.PC"
    - "355.AN"
  quicklook:
    show_pbl: true
    show_tropopause: true
    mean_profile_smooth_bins: 20
    max_time_gap_minutes: 10
    missing_data_color: "lightgray"
    colormap: "jet"
  level2_qa:
    enabled: true
    max_altitude_km: 30.0
    smooth_bins: 15
    generate_gluing_qa: true
    generate_molecular_fit_qa: true
    generate_scattering_ratio_qa: true
    generate_kfs_qa: true

inversion:
  wavelengths_to_process: [355, 532]
  block_average_minutes: 20
  kfs_mode: "two_sided"
  products:
    save_glued_signal: true
    save_molecular_profile: true
    save_scattering_ratio: true
    save_aerosol_backscatter: true
    save_aerosol_extinction: true
    save_uncertainty: true
    save_quality_flags: true
  monte_carlo_iterations: 300
  random_seed: 143
  beta_ref_relative_std: 0.10
  aerosol_ref_fraction: 0.0
  min_lidar_ratio_sr: 10.0
  allow_negative_aerosol: false

  molecular_fit:
    ref_alt_min_m: 5000.0
    ref_alt_max_m: 25000.0
    ref_window_bins: 667
    lidar_ratio_molecular_sr: 8.377580409572781
    max_relative_slope: 0.25
    max_relative_variance: 0.50
    min_valid_fraction: 0.50

  gluing:
    window_length_bins: 120
    correlation_threshold: 0.95
    intercept_threshold: 5.0
    minmax_threshold: 0.05
    max_relative_rmse: 0.08
    max_relative_bias: 0.05
    min_valid_fraction: 0.80
    max_saturation_fraction: 0.20
    invalid_saturation_fraction: 1.0
    search_min_idx: 150
    search_max_idx: 1200
    allow_single_channel_fallback: true
    single_channel_priority: "photon_counting"

  lidar_ratio_std_sr:
    "355": 15.0
    "532": 10.0
    "1064": 10.0

  lidar_ratios_sr:
    "355":
      "01": 75.95
      "02": 116.08
