# ==========================================
# MILGRAU algorithm / processing configuration
# Station-specific metadata lives in station.yaml.
# ==========================================

station_config: "station.yaml"

project:
  name: "MILGRAU"
  full_name: "Multi-Indexed LALINET GeneRAlized and Unified algorithm"

processing:
  incremental: true
  # Operator console: concise stage/save-id progress and actionable warnings.
  console_level: "INFO"
  # Audit file: retains channel/source/cache/retrieval diagnostics.
  file_level: "DEBUG"
  spurious_extensions: [".dpp", ".zip", ".txt"]
  # Quarantine is auditable retained evidence, not disposable cache.
  quarantine_dir: "quarantine"
  # Cache directories now live outside the raw-data tree, so no cache-specific
  # raw-scan exclusions are required by the repository configuration.
  raw_scan_ignore_dirs: []

directories:
  raw_data: "01-data"
  processed_data: "02-processed_data"
  log_dir: "logs"

# Productive LIBIDS Level 0 processing policy. These values are required
# explicitly before discovery/processing; code must not invent replacements.
level0:
  acquisition_qa:
    laser_shot_tolerance_fraction: 0.002
    licel_header_time_jitter_s: 1.0
  dark_current:
    max_association_hours: 12.0
  surface_weather:
    # Missing weather is preserved as missing rather than replaced by an
    # invented temperature/pressure pair. Use "fail" for a strict run.
    missing_policy: "nan"

# Transitional Level 0/runtime field. Native Licel channel metadata takes
# precedence; removal/reclassification of this field remains tracked.
physics:
  vertical_resolution_m: 7.5

# Productive LIPANCORA scientific/instrument-processing recipe. These values are
# required explicitly; Level 1 code must not provide semantic defaults.
level1:
  background:
    start_altitude_m: 29000.0
    stop_altitude_m: 29999.0
  photon_counting:
    deadtime_min_denominator: 0.05
  pbl:
    reference_channel: "532.AN"
    min_search_altitude_m: 500.0
    max_search_altitude_m: 4000.0
    smooth_bins: 15

  # Historical files may contain channels for which no traceable instrument
  # calibration survives in the repository. This policy keeps those files
  # processable without pretending that a measured calibration exists.
  missing_channel_calibration:
    policy: "neutral_with_warning"
    neutral_values:
      deadtime_us: 0.0
      bin_shift_bins: 0
      background_offset: 0.0

  atmosphere:
    # Source order is scientific policy. Exhaustion without a usable source is
    # a processing failure unless a later source is explicitly listed here.
    source_priority: ["radiosonde", "era5", "ussa76"]

    # External profiles rarely span the complete lidar altitude grid. The
    # extension behavior is explicit rather than an implicit standard-atmosphere fallback.
    external_profile_outside_coverage: "ussa76"

    radiosonde:
      cache_dir: ".cache/radiosonde"
      synoptic_hours_utc: [0, 12]
      selection: "nearest"
      max_time_delta_hours: 6.0

    # CDS credentials are never stored here; cdsapi reads ~/.cdsapirc.
    era5:
      cache_dir: ".cache/era5"
      dataset: "reanalysis-era5-pressure-levels"
      grid_deg: 0.25
      area_half_width_deg: 0.25
      pressure_levels_hpa:
        [1000, 975, 950, 925, 900, 875, 850, 825, 800, 775, 750, 700, 650, 600, 550, 500, 450, 400, 350, 300, 250, 225, 200, 175, 150, 125, 100, 70, 50, 30, 20, 10, 7, 5, 3, 2, 1]

surface_weather:
  cache_dir: ".cache/weather"

visualization:
  output_format: "webp"
  dpi: 120
  altitude_ranges_km: [5, 15, 30]
  channels_to_plot:
    - "1064.AN"
    - "532.AN"
    - "532.PC"
    - "355.PC"
    - "355.AN"
  quicklook:
    show_pbl: true
    show_tropopause: true
    mean_profile_smooth_bins: 20
    max_time_gap_minutes: 10
    missing_data_color: "lightgray"
    colormap: "jet"
  level2_qa:
    enabled: true
    max_altitude_km: 30.0
    smooth_bins: 15
    generate_gluing_qa: true
    generate_molecular_fit_qa: true
    generate_scattering_ratio_qa: true
    generate_kfs_qa: true

# Level 2 scientific retrieval recipe. Values in this section are mandatory
# for productive LEBEAR retrievals; code must not supply semantic fallbacks.
inversion:
  wavelengths_to_process: [355, 532]
  block_average_minutes: 20
  kfs_mode: "two_sided"
  products:
    save_glued_signal: true
    save_molecular_profile: true
    save_scattering_ratio: true
    save_aerosol_backscatter: true
    save_aerosol_extinction: true
    save_uncertainty: true
    save_quality_flags: true

  monte_carlo_iterations: 300
  random_seed: 143
  beta_ref_relative_std: 0.10
  aerosol_ref_fraction: 0.0
  min_lidar_ratio_sr: 10.0
  allow_negative_aerosol: false

  # Rayleigh molecular lidar ratio is a versioned algorithm/physics constant in
  # milgrau.level2.constants and is intentionally not user-configurable.
  molecular_fit:
    ref_alt_min_m: 5000.0
    ref_alt_max_m: 25000.0
    ref_window_bins: 667
    max_relative_slope: 0.25
    max_relative_variance: 0.50
    min_valid_fraction: 0.50

  gluing:
    window_length_bins: 120
    correlation_threshold: 0.95
    intercept_threshold: 5.0
    gaussian_threshold: 0.10
    minmax_threshold: 0.05
    max_relative_rmse: 0.08
    max_relative_bias: 0.05
    min_valid_fraction: 0.80
    max_saturation_fraction: 0.20
    invalid_saturation_fraction: 1.0
    search_min_idx: 150
    search_max_idx: 1200
    allow_single_channel_fallback: true
    single_channel_priority: "photon_counting"

  # Cloud screening is an explicit policy. While disabled, no detector values
  # are interpreted. Enabling it requires the complete detector configuration.
  cloud_screening:
    enabled: false

  # Aerosol lidar-ratio climatology is observational station metadata and lives
  # in station.yaml. Legacy external configs may still provide lidar_ratios_sr /
  # lidar_ratio_std_sr as an explicit compatibility fallback, but this repository
  # does not duplicate the SPU climatology here.
