        background_offset: 0.0000
      "408.PC":
        detector_mode: "photon_counting"
        deadtime_us: 0.0000
        bin_shift_bins: -2
        background_offset: 0.0000
        saturation: {status: "not_characterized"}
      "408.AN":
        detector_mode: "analog"
        deadtime_us: 0.0000
        bin_shift_bins: 8
        background_offset: 0.0000
      "530.PC":
        detector_mode: "photon_counting"
        deadtime_us: 0.0000
