station:
  id: "spu"
  name: "SPU-Lidar"
  institution: "IPEN/USP"
  timezone: "America/Sao_Paulo"
  site:
    latitude: -23.5607
    longitude: -46.7398
    station_altitude_m: 766.0
  radiosonde:
    station_id: "83779"
    station_name: "SBMT Marte Civ"

# SCC policy is station/instrument metadata, not a processing fallback.
# fixed_value=1 tells ELPP to use the fixed lidar ratio stored in the SCC database.
# When a Raman companion wavelength is present, LR_Input is left undefined for
# the elastic wavelength. A concrete day/night SCC configuration may still
# provide its own explicit lr_input mapping.
scc_policy:
  lr_input:
    fixed_value: 1
    raman_companions_nm:
      "355": [387, 408]
      "532": [530]
      "1064": []

# Named instrument calibration sets. The historical repository documented only
# one global correction table, so all current profiles intentionally reference
# this migrated set. Do not infer distinct historical calibrations without a
# traceable source. Photon-counting saturation is explicitly not characterized
# in the current source material rather than being assigned an invented limit.
calibrations:
  spu-channel-corrections-v1:
    provenance:
      source: "migrated_from_legacy_global_channel_corrections"
    channels:
      "355.PC":
        detector_mode: "photon_counting"
        deadtime_us: 0.0020
        bin_shift_bins: -2
        background_offset: 0.0005
        saturation: {status: "not_characterized"}
      "355.AN":
        detector_mode: "analog"
        deadtime_us: 0.0000
        bin_shift_bins: -11
        background_offset: 0.0000
      "387.PC":
        detector_mode: "photon_counting"
        deadtime_us: 0.0000
        bin_shift_bins: -2
        background_offset: 0.0000
        saturation: {status: "not_characterized"}
      "387.AN":
