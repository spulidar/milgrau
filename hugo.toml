baseURL = "https://spulidar.github.io/milgrau/"
languageCode = "en-us"
title = "MILGRAU | Scientific lidar processing"
contentDir = ".hugo-content"
enableRobotsTXT = true
enableEmoji = true

[module]
  [module.hugoVersion]
    min = "0.140.0"
    extended = true

  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    version = "v0.3.0"

  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    version = "65c073a5941a7c76d90ad4d67bf152cad50abd1c"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
  [markup.goldmark.extensions.passthrough]
    enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[' , '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[params]
  google_fonts = [["Inter", "300, 400, 600, 700"], ["Fira Code", "400, 500, 700"]]
  sans_serif_font = "Inter"
  secondary_font = "Inter"
  mono_font = "Fira Code"
  [params.footer]
    copyright = "© :YEAR: SPU-Lidar · MILGRAU. Scientific processing and documentation."
  [params.social]
    github = "https://github.com/spulidar/milgrau"
  [params.docs]
    title = "MILGRAU Scientific Documentation"
    themeColor = "blue"
    darkMode = true
    prism = true
    breadcrumbs = true
    sidebarIcons = true
    toc = true
    tocMobile = true
    scrollSpy = true
    descriptions = true
    navDesc = true
    backToTop = true
    repoURL = "https://github.com/spulidar/milgrau"
    repoBranch = "main"
    editPage = false
    lastMod = false
    intLinkTooltip = false
  [params.flexsearch]
    enabled = true
  [params.render_hooks.link]
    errorLevel = "warning"

[menu]
  [[menu.primary]]
    name = "Documentation"
    url = "docs/"
    identifier = "docs"
    weight = 10
  [[menu.primary]]
    name = "GitHub"
    url = "https://github.com/spulidar/milgrau"
    identifier = "github"
    weight = 20
