hero:
  enable: true
  weight: 10
  template: hero
  badge:
    text: "Open-source atmospheric lidar science"
    color: primary
    pill: true
    soft: true
  title: "MILGRAU"
  subtitle: "**Multi-Indexed LALINET GeneRAlized and Unified Algorithm.** A transparent processing workflow from original Licel acquisitions to corrected signals and conditional aerosol optical products."
  image:
    path: "images"
    filename: "milgrau-workflow.svg"
    alt: "Conceptual three-stage lidar processing diagram: Level 0 acquisitions, Level 1 corrected signals and Level 2 aerosol optical retrieval"
  ctaButton:
    icon: rocket_launch
    btnText: "Get started"
    url: "docs/getting-started/getting_started/"
  cta2Button:
    icon: menu_book
    btnText: "Explore the science"
    url: "docs/"
  info: "SPU-Lidar · IPEN/USP, São Paulo · Scientific methods and limitations are documented explicitly."

featureGrid:
  enable: true
  weight: 20
  template: "feature grid"
  title: "One observation, three scientific levels"
  subtitle: "Every stage preserves the continuous session identity while adding the information needed to evaluate its scientific validity."
  items:
    - title: "01 — LIBIDS"
      icon: dataset
      description: "**Level 0 · Acquisition.** Read Licel data, verify acquisition quality, associate dark currents and preserve instrument provenance."
      ctaLink:
        text: "Level 0 methodology"
        url: "docs/processing/level-0/libids/"
    - title: "02 — LIPANCORA"
      icon: monitoring
      description: "**Level 1 · Correction.** Correct analog and photon-counting signals, propagate uncertainty and characterize the molecular atmosphere."
      ctaLink:
        text: "Level 1 methodology"
        url: "docs/processing/level-1/lipancora/"
    - title: "03 — LEBEAR"
      icon: stacked_line_chart
      description: "**Level 2 · Retrieval.** Estimate aerosol backscatter and conditional extinction with reference, uncertainty and validity diagnostics."
      ctaLink:
        text: "Level 2 methodology"
        url: "docs/processing/level-2/lebear/"

scienceValues:
  enable: true
  weight: 30
  template: "science values"
  title: "Built for scientific scrutiny"
  subtitle: "A successful processing run is a starting point for interpretation — not a certificate of physical validity."
  items:
    - icon: "fact_check"
      title: "Traceable observations"
      description: "Keep acquisition times, historical channel configuration and input identity connected to each product."
    - icon: "air"
      title: "Explicit atmosphere"
      description: "Distinguish ERA5 reanalysis, observed radiosondes and USSA76 fallback at the relevant time and height."
    - icon: "query_stats"
      title: "Visible uncertainty"
      description: "Inspect masks, instrumental assumptions, quality warnings and supported altitude ranges."
  cta:
    text: "Read the scientific quality guide"
    url: "docs/scientific-validation/scientific_quality/"
